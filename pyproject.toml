[project]
name = "upsc-pyq-study-app"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"fastapi==0.141.1",
	"uvicorn==0.52.1",
	"python-dotenv>=1.0.1",
	"pymongo==4.17.0",
	"pydantic>=2.6.4",
	"pyjwt>=2.10.1",
	"motor==3.7.1",
	"httpx>=0.27.0",
	"python-multipart>=0.0.9",
	"webauthn==3.0.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.scripts]
build = "yarn --cwd frontend install --frozen-lockfile && yarn --cwd frontend build"

[tool.vercel.fastapi.static]
cdn = true